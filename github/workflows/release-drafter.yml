name: Release Drafter

on:
  push:
    branches:
      - main
  # autolabeler を使うため pull_request も対象にする
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # リリースのドラフト作成に必要
      pull-requests: write   # autolabeler による PR ラベル付与に必要
    steps:
      # サードパーティ Action はコミット SHA で固定する（更新は Dependabot / Renovate に任せる）
      - uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7 # v6.4.0
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
